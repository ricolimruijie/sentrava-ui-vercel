<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SentraVA — Centralized Vulnerability Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined: icon font used by the login page -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet" />
    <!-- Apply the saved theme before first paint so there is no light flash. -->
    <script>try{if(localStorage.getItem('sentra_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
    <style>
      /* Splash screen: shown from first paint until the app is mounted (see src/utils/splash.js).
         Same animated coral background as the login page; light and dark themes look alike. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; overflow: hidden; isolation: isolate; background: #b7101c; transition: opacity .5s ease, visibility 0s .5s; }
      #splash.splash--out { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash__base { position: absolute; inset: 0; background: radial-gradient(120% 90% at 20% 10%, #ff2529, #b7101c 45%, #5c070e 100%); }
      .splash__shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,0,6,0) 45%, rgba(40,0,6,.55) 100%); }
      .splash__blob { position: absolute; aspect-ratio: 1; }
      .splash__blob--1 { left: -12%; top: -14%; width: 58%; background: linear-gradient(150deg, #ff5a3c, #e31724); box-shadow: 0 50px 90px -20px rgba(60,0,8,.55); animation: splash-morph-a 22s ease-in-out infinite; }
      .splash__blob--2 { right: -18%; top: -10%; width: 62%; background: linear-gradient(200deg, #b7101c, #8a0c15); box-shadow: 0 50px 90px -20px rgba(60,0,8,.55); animation: splash-morph-b 26s ease-in-out infinite; }
      .splash__blob--3 { left: 26%; top: 22%; width: 52%; background: linear-gradient(160deg, #e31724, #b7101c); box-shadow: 0 60px 100px -20px rgba(50,0,6,.6); animation: splash-morph-c 20s ease-in-out infinite; }
      .splash__blob--4 { right: -14%; bottom: -18%; width: 56%; background: linear-gradient(330deg, #ff4a2e, #ff2529); box-shadow: 0 -40px 90px -20px rgba(60,0,8,.5); animation: splash-morph-b 24s ease-in-out -8s infinite; }
      .splash__blob--5 { left: -16%; bottom: -24%; width: 60%; background: linear-gradient(30deg, #3e070b, #5c070e); box-shadow: 0 -40px 90px -20px rgba(30,0,4,.6); animation: splash-morph-a 28s ease-in-out -12s infinite; }
      .splash__box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; animation: splash-in .7s cubic-bezier(.2,.8,.2,1) both; }
      .splash__mark { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
      .splash__mark::before { content: ''; position: absolute; inset: -22px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.28), rgba(255,255,255,0) 68%); animation: splash-glow 2.4s ease-in-out infinite; }
      .splash__mark img { position: relative; width: 68px; height: 68px; filter: brightness(0) invert(1); }
      .splash__name { font: 800 22px/1 'Plus Jakarta Sans', 'Manrope', system-ui, sans-serif; letter-spacing: .2em; margin-right: -.2em; color: #fff; }
      .splash__bar { position: relative; width: 132px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.25); }
      .splash__bar::after { content: ''; position: absolute; inset: 0; width: 45%; background: linear-gradient(90deg, rgba(255,255,255,0), #fff); animation: splash-bar 1.3s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(8px) scale(.96) } }
      @keyframes splash-glow { 0%,100% { opacity: .65; transform: scale(.92) } 50% { opacity: 1; transform: scale(1.08) } }
      @keyframes splash-bar { from { transform: translateX(-100%) } to { transform: translateX(230%) } }
      @keyframes splash-morph-a { 0%,100% { border-radius: 58% 42% 63% 37% / 45% 55% 45% 55%; transform: translate(0,0) rotate(0) } 50% { border-radius: 40% 60% 38% 62% / 60% 38% 62% 40%; transform: translate(4%,6%) rotate(18deg) } }
      @keyframes splash-morph-b { 0%,100% { border-radius: 42% 58% 35% 65% / 58% 40% 60% 42%; transform: translate(0,0) rotate(0) } 50% { border-radius: 63% 37% 56% 44% / 40% 62% 38% 60%; transform: translate(-5%,-4%) rotate(-22deg) } }
      @keyframes splash-morph-c { 0%,100% { border-radius: 50% 50% 40% 60% / 40% 60% 50% 50%; transform: translate(0,0) scale(1) } 50% { border-radius: 36% 64% 60% 40% / 62% 36% 64% 38%; transform: translate(3%,-6%) scale(1.06) } }
      @media (prefers-reduced-motion: reduce) { .splash__box, .splash__mark::before, .splash__bar::after, .splash__blob { animation: none } .splash__bar::after { width: 100% } #splash { transition-duration: .01s } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading SentraVA">
      <div class="splash__base"></div>
      <span class="splash__blob splash__blob--1"></span><span class="splash__blob splash__blob--2"></span><span class="splash__blob splash__blob--3"></span><span class="splash__blob splash__blob--4"></span><span class="splash__blob splash__blob--5"></span>
      <div class="splash__shade"></div>
      <div class="splash__box">
        <div class="splash__mark"><img src="/src/assets/sentrava-logo-icon.svg" alt="" /></div>
        <div class="splash__name">SENTRAVA</div>
        <div class="splash__bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
